<div class="tool-view fade-in">
    <header class="tool-header">
        <div class="tool-header__info">
            <h1 class="tool-header__title">System Architect Assistant</h1>
            <p class="tool-header__desc">
                Design scalable, secure, and maintainable system architectures and database schemas.
            </p>
        </div>
        <div class="tool-header__actions">
            <button class="btn btn-ghost" (click)="clear()" [disabled]="loading()">
                Clear
            </button>
        </div>
    </header>

    <div class="tool-layout">
        <div class="tool-panel card">
            <div class="input-group">
                <label class="section-label">High-level Goal</label>
                <input class="input" placeholder="e.g., E-commerce platform with microservices, Real-time chat app..."
                    [ngModel]="goal()" (ngModelChange)="goal.set($event)" [disabled]="loading()" />
            </div>

            <div class="input-group">
                <label class="section-label">Detailed Requirements & Constraints</label>
                <textarea class="textarea"
                    placeholder="List functional requirements, expected user load, tech stack preferences, etc..."
                    [ngModel]="requirements()" (ngModelChange)="requirements.set($event)"
                    [disabled]="loading()"></textarea>
            </div>

            <div class="panel-footer">
                <button class="btn btn-primary btn-lg w-full" (click)="generateArchitecture()"
                    [disabled]="loading() || !goal().trim()">
                    {{ loading() ? 'Designing System...' : 'Generate Architectural Plan' }}
                </button>
            </div>
        </div>

        <div class="tool-results" id="result-area">
            @if (loading()) {
            <div class="results-empty card ai-loading-card">
                <app-loading-spinner message="Mapping out architecture & schemas..."></app-loading-spinner>
            </div>
            } @else if (response() || error()) {
            <app-ai-response [response]="response()" [error]="error()"></app-ai-response>
            } @else {
            <div class="results-empty card">
                <div class="empty-state">
                    <span class="empty-state__icon">
                        <i class="bi bi-diagram-3"></i>
                    </span>
                    <h3 class="empty-state__title">Architect at Work</h3>
                    <p class="empty-state__desc">
                        Define your system's goal and requirements to see a complete architectural blueprint.
                    </p>
                </div>
            </div>
            }
        </div>
    </div>
</div>

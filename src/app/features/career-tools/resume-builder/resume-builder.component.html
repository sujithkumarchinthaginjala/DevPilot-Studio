<div class="tool-view fade-in">
    @if (resumeService.profileType() === 'none') {
    <app-resume-onboarding></app-resume-onboarding>
    } @else {
    <div class="resume-builder-layout">
        <!-- Top Navigation & Global Actions -->
        <app-resume-header></app-resume-header>

        <div class="vertical-workflow container-center">
            <!-- Navigation Stepper -->
            <app-resume-stepper class="sticky-stepper"></app-resume-stepper>

            <!-- Main Section Editor -->
            <div class="editor-section-wrapper">
                <app-resume-section-editor></app-resume-section-editor>
            </div>

            <!-- Secondary Tools: JD Matcher -->
            <div class="jd-matcher-wrapper">
                <app-resume-matcher></app-resume-matcher>
            </div>

            <!-- Live Preview: The Final Step -->
            <div class="preview-section-wrapper">
                <app-resume-preview></app-resume-preview>
            </div>
        </div>
    </div>
    }
</div>

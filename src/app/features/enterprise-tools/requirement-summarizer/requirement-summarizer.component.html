<div class="tool-view fade-in">
    <header class="tool-header">
        <div class="tool-header__info">
            <h1 class="tool-header__title">Requirement Summarizer</h1>
            <p class="tool-header__desc">
                Distill raw, complex requirement documents into structured project objectives.
            </p>
        </div>
        <div class="tool-header__actions">
            <button class="btn btn-ghost" (click)="clear()" [disabled]="loading()">
                Clear
            </button>
        </div>
    </header>

    <div class="tool-layout">
        <div class="tool-panel card">
            <div class="input-group">
                <label class="section-label">Raw Requirements / Brief</label>
                <textarea class="textarea" placeholder="Paste the raw requirements, PRD notes, or feature brief here..."
                    [ngModel]="requirements()" (ngModelChange)="requirements.set($event)" [disabled]="loading()"
                    style="min-height: 350px;"></textarea>
            </div>

            <div class="panel-footer">
                <button class="btn btn-primary btn-lg w-full" (click)="summarize()"
                    [disabled]="loading() || !requirements().trim()">
                    {{ loading() ? 'Processing Reqs...' : 'Summarize Requirements' }}
                </button>
            </div>
        </div>

        <div class="tool-results">
            @if (loading()) {
            <div class="results-empty card">
                <app-loading-spinner message="Extracting system requirements..."></app-loading-spinner>
            </div>
            } @else if (response() || error()) {
            <app-ai-response [response]="response()" [error]="error()"></app-ai-response>
            } @else {
            <div class="results-empty card">
                <div class="empty-state">
                    <span class="empty-state__icon">📄</span>
                    <h3 class="empty-state__title">Waiting for Requirements</h3>
                    <p class="empty-state__desc">
                        Paste your requirement docs to see a structured system breakdown.
                    </p>
                </div>
            </div>
            }
        </div>
    </div>
</div>

<div class="tool-view fade-in">
    <header class="tool-header">
        <div class="tool-header__info">
            <h1 class="tool-header__title">SWOT Analysis Tool</h1>
            <p class="tool-header__desc">
                Analyze Strengths, Weaknesses, Opportunities, and Threats for any business or project.
            </p>
        </div>
        <div class="tool-header__actions">
            <button class="btn btn-ghost" (click)="clear()" [disabled]="loading()">
                Clear
            </button>
        </div>
    </header>

    <div class="tool-layout">
        <div class="tool-panel card">
            <div class="input-group">
                <label class="section-label">Business / Project Name</label>
                <input class="input" placeholder="e.g., Apple Inc, My New SaaS, Marketing Campaign..."
                    [ngModel]="businessName()" (ngModelChange)="businessName.set($event)" [disabled]="loading()" />
            </div>

            <div class="input-group">
                <label class="section-label">Description & Context</label>
                <textarea class="textarea"
                    placeholder="Briefly describe the business model, target market, and current situation..."
                    [ngModel]="description()" (ngModelChange)="description.set($event)"
                    [disabled]="loading()"></textarea>
            </div>

            <div class="panel-footer">
                <button class="btn btn-primary btn-lg w-full" (click)="generateSwot()"
                    [disabled]="loading() || !businessName().trim()">
                    {{ loading() ? 'Analyzing Strategy...' : 'Perform SWOT Analysis' }}
                </button>
            </div>
        </div>

        <div class="tool-results" id="result-area">
            @if (loading()) {
            <div class="results-empty card ai-loading-card">
                <app-loading-spinner message="Evaluating strategic factors..."></app-loading-spinner>
            </div>
            } @else if (response() || error()) {
            <app-ai-response [response]="response()" [error]="error()"></app-ai-response>
            } @else {
            <div class="results-empty card">
                <div class="empty-state">
                    <span class="empty-state__icon">
                        <i class="bi bi-grid-3x3-gap"></i>
                    </span>
                    <h3 class="empty-state__title">Strategic Insights</h3>
                    <p class="empty-state__desc">
                        Enter your business details to generate a comprehensive SWOT analysis and strategic
                        recommendations.
                    </p>
                </div>
            </div>
            }
        </div>
    </div>
</div>

<div class="tool-view fade-in">
    <header class="tool-header">
        <div class="tool-header__info">
            <h1 class="tool-header__title">Email Drafter</h1>
            <p class="tool-header__desc">
                Draft high-impact professional emails with the perfect tone and structure.
            </p>
        </div>
        <div class="tool-header__actions">
            <button class="btn btn-ghost" (click)="clear()" [disabled]="loading()">
                Clear
            </button>
        </div>
    </header>

    <div class="tool-layout">
        <div class="tool-panel card">
            <div class="input-group">
                <label class="section-label">Purpose of Email</label>
                <input class="input" placeholder="e.g., Requesting a meeting, following up on proposal..."
                    [ngModel]="purpose()" (ngModelChange)="purpose.set($event)" [disabled]="loading()" />
            </div>

            <div class="input-group">
                <label class="section-label">Context & Details</label>
                <textarea class="textarea" placeholder="Mention key points, specific deadlines, or names to include..."
                    [ngModel]="context()" (ngModelChange)="context.set($event)" [disabled]="loading()"></textarea>
            </div>

            <div class="input-group">
                <label class="section-label">Select Tone</label>
                <div class="tone-grid">
                    @for (t of tones; track t.id) {
                    <button class="tone-btn" [class.active]="tone() === t.id" (click)="tone.set(t.id)"
                        [disabled]="loading()">
                        {{ t.label }}
                    </button>
                    }
                </div>
            </div>

            <div class="panel-footer">
                <button class="btn btn-primary btn-lg w-full" (click)="generateEmail()"
                    [disabled]="loading() || !purpose().trim()">
                    {{ loading() ? 'Drafting...' : 'Generate Email Draft' }}
                </button>
            </div>
        </div>

        <div class="tool-results">
            @if (loading()) {
            <div class="results-empty card">
                <app-loading-spinner message="Crafting professional draft..."></app-loading-spinner>
            </div>
            } @else if (response() || error()) {
            <app-ai-response [response]="response()" [error]="error()"></app-ai-response>
            } @else {
            <div class="results-empty card">
                <div class="empty-state">
                    <span class="empty-state__icon">✉️</span>
                    <h3 class="empty-state__title">Ready to Draft</h3>
                    <p class="empty-state__desc">
                        Provide the context and purpose on the left to see a professional draft.
                    </p>
                </div>
            </div>
            }
        </div>
    </div>
</div>

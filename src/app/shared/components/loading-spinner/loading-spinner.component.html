<div class="spinner-wrapper" [class]="'spinner-wrapper--' + size">
    <div class="spinner-ring">
        <div class="spinner-ring__orbit"></div>
        <div class="spinner-ring__core">
            <i class="bi bi-arrow-repeat"></i>
        </div>
    </div>
    <p class="spinner-message">{{ message }}</p>
</div>
